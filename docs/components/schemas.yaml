SubscribeRequest:
  type: object
  required:
    - email
    - repo
  properties:
    email:
      type: string
      format: email
      description: Email address to subscribe
    repo:
      type: string
      description: GitHub repository in owner/repo format (e.g., golang/go)

SubscriptionSagaAcceptedResponse:
  type: object
  required:
  - message
  - sagaId
  - subscriptionId
  - status
  properties:
    message:
      type: string
      example: Subscription request accepted. Please check your email.
    sagaId:
      type: string
      format: uuid
      description: Identifier of the subscription Saga
    subscriptionId:
      type: string
      format: uuid
      description: Identifier of the pending subscription
    status:
      type: string
      enum:
      - EMAIL_SEND_REQUESTED
      description: Current state of the asynchronous subscription Saga

Subscription:
  type: object
  properties:
    email:
      type: string
    repo:
      type: string
    confirmed:
      type: boolean
    last_seen_tag:
      type: string
      nullable: true
