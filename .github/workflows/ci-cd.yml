name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  REDIS_URL: redis://localhost:6379
  API_KEY: super-secret-key
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  SMTP_HOST: smtp.mailtrap.io
  SMTP_PORT: 1025
  SMTP_USER: dummy-user
  SMTP_PASS: dummy-pass
  SMTP_FROM: test@example.com
  APP_URL: http://localhost:3000

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/notification-contracts/package-lock.json
            services/notification-service/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install notification contracts dependencies
        working-directory: packages/notification-contracts
        run: npm ci

      - name: Build notification contracts
        working-directory: packages/notification-contracts
        run: npm run build

      - name: Run linter
        run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Build
        run: npm run build

      - name: Install notification service dependencies
        working-directory: services/notification-service
        run: npm ci

      - name: Build notification service
        working-directory: services/notification-service
        run: npm run build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npm run test:unit

  notification-service-tests:
    name: Notification Service Tests
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            packages/notification-contracts/package-lock.json
            services/notification-service/package-lock.json

      - name: Install notification contracts dependencies
        working-directory: packages/notification-contracts
        run: npm ci

      - name: Build notification contracts
        working-directory: packages/notification-contracts
        run: npm run build

      - name: Install notification service dependencies
        working-directory: services/notification-service
        run: npm ci

      - name: Run notification service tests
        working-directory: services/notification-service
        run: npm run test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run integration tests
        run: npm run test:integration

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  cd:
    name: Deploy
    needs:
      [unit-tests, integration-tests, e2e-tests, notification-service-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_APP }}"
