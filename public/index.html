<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Release Notifier</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>GitHub Notifier</h1>
      <p class="subtitle">Get email alerts for new GitHub releases.</p>

      <form id="subscribe-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            data-testid="email-input"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="repo">GitHub Repository</label>
          <input
            type="text"
            id="repo"
            data-testid="repo-input"
            placeholder="owner/repo (e.g. facebook/react)"
            required
          />
        </div>

        <button type="submit" data-testid="submit-button">Subscribe</button>
      </form>

      <div id="message-box" data-testid="message-box" class="hidden"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
